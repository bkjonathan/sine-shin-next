services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Localhost only: Traefik reaches the container over the Docker network,
      # and a public host port would bypass it and TLS (AUDIT.md F-31).
      - "127.0.0.1:3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - AUTH_TRUST_HOST=true
    restart: unless-stopped
